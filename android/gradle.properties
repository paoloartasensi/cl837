org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:+CMSClassUnloadingEnabled -XX:+CMSPermGenSweepingEnabled
android.useAndroidX=true
android.enableJetifier=true

# Ottimizzazioni per velocizzare la build e risolvere memory issues
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.enableR8.fullMode=false
org.gradle.daemon=true
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Configurazioni aggiuntive per Java 11
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.workers.max=4